name: Deploy to CloudPanel EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Site
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build
          cd server && npm install

      - name: Deploy Production Files to CloudPanel Root
        run: |
          # Ensure destination folder exists
          mkdir -p /home/divija-s2/htdocs/s2.divija.netigadarnews.in

          # Sync only production assets
          rsync -av --delete dist/ /home/divija-s2/htdocs/s2.divija.netigadarnews.in/dist/
          rsync -av --delete server/ /home/divija-s2/htdocs/s2.divija.netigadarnews.in/server/
          cp package.json package-lock.json ecosystem.config.cjs /home/divija-s2/htdocs/s2.divija.netigadarnews.in/

          # Copy server env credentials if present (update this path if your s2 env is elsewhere)
          if [ -f /home/divija-s2/repo-s2-base/server/.env ]; then
            cp /home/divija-s2/repo-s2-base/server/.env /home/divija-s2/htdocs/s2.divija.netigadarnews.in/server/.env
          fi

          # Clean up any leftover raw source files from htdocs
          rm -rf /home/divija-s2/htdocs/s2.divija.netigadarnews.in/src \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/public \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/.git \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/.github \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/tsconfig*.json \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/vite.config.ts \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/index.html \
                 /home/divija-s2/htdocs/s2.divija.netigadarnews.in/README.md

      - name: Reload Node Backend API (PM2)
        run: |
          cd /home/divija-s2/htdocs/s2.divija.netigadarnews.in
          npx pm2 reload ecosystem.config.cjs || npx pm2 start ecosystem.config.cjs

      - name: Deployment Status Summary
        run: |
          echo "✅ Production deployment completed successfully to /home/divija-s2/htdocs/s2.divija.netigadarnews.in at $(date)"
